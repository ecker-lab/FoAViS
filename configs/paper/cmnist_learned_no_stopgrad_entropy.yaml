# C-MNIST, learned policy without stop-gradient, entropy target 3.5 nats.
# Paper: "w/o stop-grad + entropy" row of the stop-gradient ablation table.
# Identical to cmnist_learned.yaml except: policy_loss.stop_grad: false and policy_loss.entropy_target: 3.5 (adaptive entropy weight).
# Hardware of the reported runs: 1 GPU, batch 64.
#   python main.py ...                 single GPU
#   torchrun --nproc_per_node N main.py ...   N GPUs; dataloader.batch_size is PER GPU, keep N x batch_size equal
# Command:
#   python main.py --config_path configs/paper/cmnist_learned_no_stopgrad_entropy.yaml --data_dir <data_dir> --seed <seed>
# Seed of the reported run: 894386860

model:
  policy_loss:
    stop_grad: false
    entropy_target: 3.5
training:
  dataset_name: random_cluttered_MNIST
  num_epochs: 400
  optimizer:
    flat_epochs: 200
    step_size_epochs: 33
