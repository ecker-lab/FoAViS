# ImageNet, random locations, phase 1 of 2: from scratch, constant learning rate (75 epochs).
# Paper: initialisation of imagenet_random_phase2.
# Hardware of the reported runs: 4 GPUs, batch 16 per GPU (64 in total).
#   python main.py ...                 single GPU
#   torchrun --standalone --nproc_per_node N main.py ...   N GPUs; dataloader.batch_size is PER GPU, keep N x batch_size equal
# Command:
#   torchrun --standalone --nproc_per_node 4 main.py --config_path configs/paper/imagenet_random_phase1.yaml --data_dir <data_dir> --seed <seed>
# Seeds of the three reported runs: 1566662013, 1574030505, 985256305
# The first seed ran with a 1-layer policy head and a running-mean baseline; with random locations the policy
# head receives no gradient (policy_loss.enabled: false), so this does not change the trained model.

model:
  policy: random
  policy_loss:
    enabled: false
training:
  num_epochs: 75
  optimizer:
    flat_epochs: 75
dataloader:
  batch_size: 16
