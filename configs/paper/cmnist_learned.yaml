# C-MNIST, learned policy (stop-gradient on the memory), trained from scratch (400 epochs).
# Paper: Table 2 and Table 3 (learned-policy model), C-MNIST.
# Hardware of the reported runs: 1 GPU, batch 64.
#   python main.py ...                 single GPU
#   torchrun --nproc_per_node N main.py ...   N GPUs; dataloader.batch_size is PER GPU, keep N x batch_size equal
# Command:
#   python main.py --config_path configs/paper/cmnist_learned.yaml --data_dir <data_dir> --seed <seed>
# Seeds of the three reported runs: 1554511691, 1876209918, 418273905

training:
  dataset_name: random_cluttered_MNIST
  num_epochs: 400
  optimizer:
    flat_epochs: 200
    step_size_epochs: 33
