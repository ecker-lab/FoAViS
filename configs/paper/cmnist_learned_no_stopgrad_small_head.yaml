# C-MNIST, learned policy without stop-gradient, 129-parameter policy head.
# Paper: "w/o stop-grad + small head" row of the stop-gradient ablation table.
# Identical to cmnist_learned.yaml except: policy_loss.stop_grad: false and policy_head.channels: 0 (a single 1x1 convolution).
# Hardware of the reported runs: 1 GPU, batch 64.
#   python main.py ...                 single GPU
#   torchrun --standalone --nproc_per_node N main.py ...   N GPUs; dataloader.batch_size is PER GPU, keep N x batch_size equal
# Command:
#   python main.py --config_path configs/paper/cmnist_learned_no_stopgrad_small_head.yaml --data_dir <data_dir> --seed <seed>
# Seed of the reported run: 894386860

model:
  policy_head:
    channels: 0
  policy_loss:
    stop_grad: false
training:
  dataset_name: random_cluttered_MNIST
  num_epochs: 400
  optimizer:
    flat_epochs: 200
    step_size_epochs: 33
