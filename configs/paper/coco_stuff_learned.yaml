# COCO-Stuff semantic segmentation, learned policy (stop-gradient on the memory, 72 epochs), initialised from the
# ImageNet random-location model.
# Paper: Table 2 and Table 3 (learned-policy model), COCO-Stuff.
# Hardware of the reported runs: 1 GPU, batch 16.
#   python main.py ...                 single GPU
#   torchrun --standalone --nproc_per_node N main.py ...   N GPUs; dataloader.batch_size is PER GPU, keep N x batch_size equal
# Command:
#   python main.py --config_path configs/paper/coco_stuff_learned.yaml --data_dir <data_dir> --seed <seed> \
#       --pretrained_model_path model_ckpts/imagenet/<imagenet_random_phase2 run, first seed>/last.pth
# Seeds of the three reported runs: 501600659, 1794936288, 707223844

training:
  dataset_name: coco_stuff
  num_epochs: 72
  optimizer:
    lr: 0.0002
    flat_epochs: 36
    step_size_epochs: 8
dataloader:
  batch_size: 16
