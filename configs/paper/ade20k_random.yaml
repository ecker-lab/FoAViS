# ADE20K semantic segmentation, random locations (500 epochs), initialised from the ImageNet random-location model.
# Paper: Table 2 and Table 3 (random-location model), ADE20K.
# Hardware of the reported runs: 1 GPU, batch 16.
#   python main.py ...                 single GPU
#   torchrun --standalone --nproc_per_node N main.py ...   N GPUs; dataloader.batch_size is PER GPU, keep N x batch_size equal
# Command:
#   python main.py --config_path configs/paper/ade20k_random.yaml --data_dir <data_dir> --seed <seed> \
#       --pretrained_model_path model_ckpts/imagenet/<imagenet_random_phase2 run, first seed>/last.pth
# Seeds of the three reported runs: 1989487963, 1441722053, 1083969172

model:
  policy: random
  policy_loss:
    enabled: false
training:
  dataset_name: ade20k_semantic_seg
  optimizer:
    lr: 0.0002
    flat_epochs: 250
    step_size_epochs: 50
dataloader:
  batch_size: 16
