# ImageNet, learned policy, phase 2 of 2: continues phase 1 with a step learning-rate decay (75 epochs).
# Paper: Table 2 and Table 3 (learned-policy model), ImageNet.
# Hardware of the reported runs: 4 GPUs, batch 16 per GPU (64 in total).
#   python main.py ...                 single GPU
#   torchrun --nproc_per_node N main.py ...   N GPUs; dataloader.batch_size is PER GPU, keep N x batch_size equal
# Command:
#   torchrun --nproc_per_node 4 main.py --config_path configs/paper/imagenet_learned_phase2.yaml --data_dir <data_dir> \
#       --seed <seed> --pretrained_model_path model_ckpts/imagenet/<phase-1 run>/last.pth
# Seeds of the three reported runs: 1551034744, 1881411391, 116909500

training:
  num_epochs: 75
  restore_optimizer: true
  optimizer:
    flat_epochs: 0
    step_size_epochs: 13
    warmup_steps: 0
dataloader:
  batch_size: 16
